[build-system]
requires = [
  "setuptools==83.0.0",
  "wheel==0.45.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "ray-cluster-manager"
version = "2.8.2a1"
description = "RayClusterManager 2.x application foundation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "Pillow==10.4.0",
  "psutil==5.9.8",
  "pystray==0.19.5",
  "pythonnet==3.1.0",
  "requests==2.34.2",
]

[project.scripts]
ray-cluster-manager = "rcm.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["rcm", "rcm.*"]
namespaces = false
